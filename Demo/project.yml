name: Demo
options:
  bundleIdPrefix: com.alexeyhatkevich
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  StaleDefaultReference:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
targets:
  Demo:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: StaleDefaultReference
        product: StaleDefaultReference
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Stale Default
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexeyhatkevich.stale-default-after-delete-id-reuse.demo
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  Demo:
    build:
      targets:
        Demo: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: StaleDefaultReference/StaleDefaultReferenceTests
